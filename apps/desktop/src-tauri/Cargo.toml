[package]
name = "mp4-to-ifo-desktop"
version = "0.1.0"
description = "MP4 to IFO for macOS"
authors = ["SENA"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "mp4_to_ifo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
