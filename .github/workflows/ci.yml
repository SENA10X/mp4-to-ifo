# Standard CI: unit, integration, CLI, desktop UI and engine tests (with the bundled LGPL toolchain only),
# Rust tests, typecheck, build and the license inventory.
#
# It does NOT run the heavy media regression (the 17 local samples, about 11 GB, not in git:
# `npm run test:regression`). That runs locally or on a dedicated machine for a release candidate
# (docs/release.md). A green run here says nothing about it.
#
# No signing or notarization credentials are used or needed here; releases are built locally.
name: Standard CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  standard:
    name: Standard CI (no media regression)
    runs-on: macos-15 # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Build tools for the bundled toolchain
        run: brew install autoconf automake libtool pkg-config
      # isoinfo / mkisofs are only a test reference for the ISO writer (not shipped, not on the test PATH
      # for conversions); without them two ISO tests would be skipped and this job would fail.
      - name: ISO reference tools for tests (cdrtools)
        run: brew install cdrtools
      - name: Cache the bundled toolchain
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/build/toolchain
            apps/desktop/src-tauri/binaries
          key: toolchain-${{ runner.os }}-${{ hashFiles('apps/desktop/scripts/build-toolchain.sh') }}
      - run: npm ci
      - name: Bundled toolchain (FFmpeg LGPL, dvdauthor, Node.js)
        run: npm run build:toolchain -w @mp4-to-ifo/desktop
      - name: Tests use the bundled toolchain, not Homebrew's
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          for t in ffmpeg ffprobe dvdauthor; do ln -sf "$PWD/apps/desktop/src-tauri/binaries/$t-aarch64-apple-darwin" "$RUNNER_TEMP/tools/$t"; done
          echo "MP4_TO_IFO_FFMPEG_DIR=$RUNNER_TEMP/tools" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - run: npm run build:engine -w @mp4-to-ifo/desktop
      - name: Tests (fails if any suite was skipped)
        run: |
          npm test 2>&1 | tee "$RUNNER_TEMP/test.log"
          if grep -Eq '^# skip(ped)? [1-9]|[1-9][0-9]* skipped' "$RUNNER_TEMP/test.log"; then echo "some tests were skipped" >&2; exit 1; fi
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:rust -w @mp4-to-ifo/desktop
      - run: node apps/desktop/scripts/license-inventory.mjs --check
